# CI：只跑纯逻辑测试，不装 torch / chroma / FlagEmbedding。
#
# 为什么能这么轻：被测模块（confidence / retrieval_policy / answer_guard / obs）
# 刻意做成零第三方依赖，所以 `pip install pytest` 就是全部准备时间，整套约 2 秒。
# 需要 langchain / MCP SDK 的两个测试文件带模块级 importorskip，缺依赖时自动跳过，
# 不会因为"装不上重模型"把整条 CI 拖垮。CI 一旦超过几分钟，就没人会看它了。
name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 跑测试
        run: python -m pytest -q
