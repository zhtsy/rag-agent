<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 740" width="980" height="740" role="img" aria-label="系统数据流：用户提问 → 工具决策 → 唯一检索入口 → 图谱 / 混合检索 → 重排 → 流式输出">
  <title>系统数据流</title>
  <desc>单一检索入口，图谱查不到时自动降级到向量加 BM25，再统一重排后流式生成。</desc>

  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#141F36"/>
    </linearGradient>
    <marker id="arrow" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto">
      <path d="M0 0 L10 4.5 L0 9 Z" fill="#4C6288"/>
    </marker>
    <marker id="arrowWarn" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto">
      <path d="M0 0 L10 4.5 L0 9 Z" fill="#F0B429"/>
    </marker>
  </defs>

  <rect width="980" height="740" rx="22" fill="url(#cardBg)"/>

  <!-- 1 用户提问 -->
  <rect x="340" y="40" width="300" height="64" rx="14" fill="#16233D" stroke="#2C3D5E" stroke-width="1.5"/>
  <text x="490" y="79" text-anchor="middle" font-size="19" font-weight="600" fill="#E8EEF9"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', sans-serif">用户提问</text>

  <path d="M490 104 L490 134" stroke="#4C6288" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 工具决策 -->
  <rect x="280" y="140" width="420" height="64" rx="14" fill="#16233D" stroke="#2C3D5E" stroke-width="1.5"/>
  <text x="490" y="164" text-anchor="middle" font-size="19" font-weight="600" fill="#E8EEF9"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', sans-serif">工具决策（LLM）</text>
  <text x="490" y="188" text-anchor="middle" font-size="14" fill="#93A6C5"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', sans-serif">判断要不要检索 · 只有明确说「不查」才算数</text>

  <path d="M490 204 L490 234" stroke="#4C6288" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 唯一检索入口 -->
  <rect x="230" y="240" width="500" height="84" rx="16" fill="#0C2B3C" stroke="#38BDF8" stroke-width="2"/>
  <text x="490" y="276" text-anchor="middle" font-size="19" font-weight="700" fill="#E6F6FF"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', sans-serif">search_knowledge_base · 唯一检索入口</text>
  <text x="490" y="302" text-anchor="middle" font-size="14" fill="#8FB8CF"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', sans-serif">模型看不到第二个工具，挑错工具这件事从根上被消除</text>

  <!-- 分支 -->
  <path d="M490 324 L490 348 L270 348 L270 354" stroke="#4C6288" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M490 324 L490 348 L710 348 L710 354" stroke="#4C6288" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="352" y="340" text-anchor="middle" font-size="13" fill="#7E93B4"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans SC', sans-serif">关系类</text>
  <text x="628" y="340" text-anchor="middle" font-size="13" fill="#7E93B4"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans SC', sans-serif">其余</text>

  <!-- 4L 知识图谱 -->
  <rect x="100" y="360" width="340" height="104" rx="14" fill="#16233D" stroke="#2C3D5E" stroke-width="1.5"/>
  <text x="270" y="398" text-anchor="middle" font-size="19" font-weight="600" fill="#E8EEF9"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', sans-serif">知识图谱</text>
  <text x="270" y="422" text-anchor="middle" font-size="14" fill="#93A6C5"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans SC', sans-serif">Neo4j · LLM 生成 Cypher</text>
  <text x="270" y="444" text-anchor="middle" font-size="14" fill="#93A6C5"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans SC', sans-serif">只读闸门校验后才执行</text>

  <!-- 4R 混合检索 -->
  <rect x="540" y="360" width="340" height="104" rx="14" fill="#16233D" stroke="#2C3D5E" stroke-width="1.5"/>
  <text x="710" y="398" text-anchor="middle" font-size="19" font-weight="600" fill="#E8EEF9"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', sans-serif">向量 + BM25</text>
  <text x="710" y="422" text-anchor="middle" font-size="14" fill="#93A6C5"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans SC', sans-serif">Chroma · bge · jieba</text>
  <text x="710" y="444" text-anchor="middle" font-size="14" fill="#93A6C5"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans SC', sans-serif">按分数加权融合</text>

  <!-- 降级箭头 -->
  <path d="M444 412 L532 412" stroke="#F0B429" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowWarn)"/>
  <text x="490" y="392" text-anchor="middle" font-size="13" font-weight="600" fill="#F0B429"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans SC', sans-serif">0 行</text>
  <text x="490" y="442" text-anchor="middle" font-size="13" fill="#C7952F"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans SC', sans-serif">自动降级</text>

  <!-- 合流 -->
  <path d="M270 464 L270 496 L710 496 L710 464" stroke="#4C6288" stroke-width="2" fill="none"/>
  <path d="M490 496 L490 514" stroke="#4C6288" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5 重排 -->
  <rect x="300" y="520" width="380" height="64" rx="14" fill="#16233D" stroke="#2C3D5E" stroke-width="1.5"/>
  <text x="490" y="546" text-anchor="middle" font-size="19" font-weight="600" fill="#E8EEF9"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', sans-serif">rerank 精排</text>
  <text x="490" y="570" text-anchor="middle" font-size="14" fill="#93A6C5"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans SC', sans-serif">候选截断到 6，控制 CPU 延迟</text>

  <path d="M490 584 L490 610" stroke="#4C6288" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6 输出 -->
  <rect x="250" y="616" width="480" height="78" rx="14" fill="#12283C" stroke="#2DD4BF" stroke-width="1.5"/>
  <text x="490" y="650" text-anchor="middle" font-size="19" font-weight="600" fill="#E8FBF7"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', sans-serif">SSE 流式输出</text>
  <text x="490" y="676" text-anchor="middle" font-size="14" fill="#8FB8CF"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans SC', sans-serif">引用来源 · 置信度 · 四态 status · 事实核查</text>
</svg>
