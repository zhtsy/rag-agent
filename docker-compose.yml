services:
  # 1. 图数据库 Neo4j
  neo4j:
    image: neo4j:5
    container_name: rag_neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:?NEO4J_AUTH is required - set NEO4J_AUTH=neo4j/password in .env}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    volumes:
      - ./neo4j_data:/data
    restart: unless-stopped

  # 2. MySQL 数据库（替代 SQLite，解决多进程并发写入锁问题）
  mysql:
    image: mysql:8.0
    container_name: rag_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required - check .env}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-rag_qa}
      - MYSQL_USER=${MYSQL_USER:-rag_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD is required - check .env}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    restart: unless-stopped
    healthcheck:
      # 口令不能写在这里：compose 文件和 docker inspect 都会把字面量暴露出来。
      # $$ 由 compose 转义成 $，交给容器内 shell 展开，值来自上面 environment 的
      # MYSQL_ROOT_PASSWORD —— 配置里只留变量名，不出现口令本身。
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # 3. FastAPI 后端
  backend:
    build: .
    container_name: rag_backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?NEO4J_PASSWORD is required - check .env}
      - HF_ENDPOINT=https://hf-mirror.com
      - HF_TOKEN=${HF_TOKEN:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-rag_user}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required - check .env}@mysql:3306/${MYSQL_DATABASE:-rag_qa}?charset=utf8mb4
    volumes:
      - .:/app
      - ./chroma_db:/app/chroma_db
      - ./knowledge_base:/app/knowledge_base
      - hf_cache:/root/.cache/huggingface
    depends_on:
      neo4j:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # 4. QA History 管理后台
  admin:
    image: rag_deploy-backend:latest
    container_name: rag_admin
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-rag_user}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required - check .env}@mysql:3306/${MYSQL_DATABASE:-rag_qa}?charset=utf8mb4
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
    command: python3 admin_app.py
    restart: unless-stopped

  # 5. Streamlit 前端
  frontend:
    image: python:3.10-slim
    container_name: rag_frontend
    working_dir: /app
    volumes:
      - .:/app
    command: bash -c "pip install streamlit requests sqlalchemy pymysql -i https://pypi.tuna.tsinghua.edu.cn/simple && streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0"
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-rag_user}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required - check .env}@mysql:3306/${MYSQL_DATABASE:-rag_qa}?charset=utf8mb4
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hf_cache:
  mysql_data:
